<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Drawler</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="app">

    <!-- Canvas area -->
    <div id="canvas-wrap">
      <div id="canvas-bg">
        <img id="ref-layer" class="hidden" alt="">
      </div>
      <canvas id="drawing-canvas"></canvas>

      <!-- Floating toolbar over canvas -->
      <div id="canvas-toolbar">
        <button class="tool-btn" id="undo-btn" title="Undo (last stroke)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 10h10a5 5 0 0 1 0 10H7m-4-10 4-4-4-4" />
          </svg>
        </button>
        <button class="tool-btn" id="clear-btn" title="Clear canvas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M19 6l-1 14H6L5 6M8 6V4h8v2" />
          </svg>
        </button>
        <div class="tool-sep"></div>
        <div id="brush-preview-wrap" title="Brush Preview">
          <div id="brush-preview"></div>
        </div>
        <label class="tool-label" title="Brush size">
          <input type="range" id="brush-size" min="2" max="60" value="10">
          <span id="brush-size-val">10</span>
        </label>
        <input type="color" id="brush-color" value="#1a1a1a" title="Brush color">
        <div class="tool-sep"></div>
        <!-- Pressure debug toggle — useful during iPad testing -->
        <button class="tool-btn" id="pressure-debug-btn" title="Show pressure debug">P</button>
        <!-- Dismiss reference layer — only visible when a reference is active -->
        <button class="tool-btn hidden" id="clear-ref-btn" title="Dismiss reference image"
          style="color: #e09050;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/><path d="m15 9-6 6m0-6 6 6"/>
          </svg>
        </button>
      </div>

      <!-- Pressure debug overlay (hidden by default) -->
      <div id="pressure-debug" class="hidden">
        <span>pressure: <b id="dbg-pressure">0.00</b></span>
        <span>tiltX: <b id="dbg-tiltx">0</b></span>
        <span>tiltY: <b id="dbg-tilty">0</b></span>
        <span>type: <b id="dbg-type">—</b></span>
      </div>
    </div>

    <!-- Controls panel -->
    <div id="panel">
      <div id="panel-inner">

        <div class="panel-section">
          <label class="panel-label" for="prompt-input">Prompt</label>
          <textarea id="prompt-input" rows="4"
            placeholder="a cat sitting on a windowsill, illustration, warm light"></textarea>
        </div>

        <div class="panel-section">
          <label class="panel-label" for="neg-prompt-input">Negative</label>
          <textarea id="neg-prompt-input" rows="2" placeholder="blurry, bad quality, artifacts"></textarea>
        </div>

        <div class="panel-section sliders">
          <div class="slider-row">
            <label for="steps-input">Steps</label>
            <input type="range" id="steps-input" min="1" max="20" value="6">
            <span class="slider-val" id="steps-val">6</span>
          </div>
          <div class="slider-row">
            <label for="strength-input">ControlNet</label>
            <input type="range" id="strength-input" min="0" max="100" value="85">
            <span class="slider-val" id="strength-val">0.85</span>
          </div>
          <div class="slider-row">
            <label for="cfg-input">CFG</label>
            <input type="range" id="cfg-input" min="10" max="150" value="10">
            <span class="slider-val" id="cfg-val">1.0</span>
          </div>
        </div>

        <div class="panel-section">
          <button id="generate-btn">Generate</button>
        </div>

        <div id="status-section" class="panel-section hidden">
          <div id="progress-bar">
            <div id="progress-fill"></div>
          </div>
          <span id="status-text">Generating…</span>
        </div>

        <div class="panel-section panel-footer">
          <small id="config-hint">
            Checking SwarmUI status…
          </small>
          <button id="settings-open-btn" class="tool-btn"
            style="width:100%; margin-top: 8px; justify-content:center; gap:6px;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1Z" />
            </svg>
            Settings
          </button>
        </div>

      </div>
    </div>

    <!-- Result overlay -->
    <div id="result-overlay" class="hidden">
      <div id="result-inner">
        <img id="result-img" alt="Generated image">
        <div id="result-actions">
          <button id="use-as-ref-btn">Use as reference</button>
          <button id="save-btn">Save</button>
          <button id="close-result-btn">Close</button>
        </div>
      </div>
    </div>

    <!-- Settings modal -->
    <div id="settings-modal" class="hidden">
      <div id="settings-inner">
        <h3 style="margin-bottom: 8px;">Settings</h3>

        <div class="panel-section">
          <label class="panel-label">SwarmUI API URL</label>
          <input type="text" id="setting-url" class="setting-input" value="http://localhost:7801">
        </div>

        <div class="panel-section">
          <label class="panel-label">Model (Text2Image)</label>
          <div style="display: flex; gap: 8px;">
            <select id="setting-model" class="setting-input" style="flex: 1;">
              <option value="">(Loading models...)</option>
            </select>
            <button id="refresh-models-btn" class="tool-btn" title="Refresh models list" style="flex: 0 0 36px; background: rgba(0,0,0,0.25); border: 1px solid var(--panel-border);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16" />
              </svg>
            </button>
          </div>
        </div>

        <div class="panel-section">
          <label class="panel-label">ControlNet Union Model</label>
          <input type="text" id="setting-controlnet" class="setting-input" placeholder="e.g. controlnet_union">
        </div>

        <div id="settings-actions" style="display: flex; gap: 10px; margin-top: 12px;">
          <button id="settings-save-btn" style="flex: 1;">Save</button>
          <button id="settings-close-btn"
            style="flex: 1; background: transparent; border: 1px solid var(--panel-border);">Cancel</button>
        </div>
      </div>
    </div>

  </div><!-- #app -->

  <!-- Perfect Freehand — pressure-aware stroke rendering -->
  <script src="https://cdn.jsdelivr.net/npm/perfect-freehand@1.2.2/dist/perfect-freehand.min.js"></script>

  <script src="js/canvas.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW Registered', reg))
          .catch(err => console.error('SW Registration failed', err));
      });
    }
  </script>
</body>

</html>
